name: Feature request
description: Propose a focused improvement.
title: "feat: "
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Who needs this and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the outcome and any alternatives considered.
    validations:
      required: true
