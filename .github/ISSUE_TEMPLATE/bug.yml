name: Bug report
description: Report a reproducible problem without sensitive data.
title: "fix: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe expected and actual behavior. Use private vulnerability reporting for security issues; never include credentials.
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Website or package key
      placeholder: bellypao
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Steps, tool versions and relevant redacted output.
    validations:
      required: true
