name: "Init CI/CD environment"
description: "Checkout code, install Node.js and bun, then install dependencies"

inputs:
  fetch-depth:
    description: "Number of commits to fetch during checkout (0 for full history)"
    required: false
    default: "1"

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - uses: "moonrepo/setup-toolchain@v0"
      with:
        auto-install: true
        cache-base: develop
        cache-version: ${{ hashFiles('.prototools') }}

    - name: Cache Bun dependencies
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}

    - name: "Install dependencies"
      shell: bash
      run: "bun install"
