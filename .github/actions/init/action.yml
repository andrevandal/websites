name: "Init CI/CD environment"
description: "Install Node.js and bun, then install dependencies"

runs:
  using: "composite"
  steps:
    - uses: "moonrepo/setup-toolchain@v0"
      with:
        auto-install: true
        cache-base: develop
        cache-version: ${{ hashFiles('.prototools') }}

    - name: Cache Bun dependencies
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}

    - name: "Install dependencies"
      shell: bash
      run: "bun install"
