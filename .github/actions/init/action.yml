name: "Init CI/CD environment"
description: "Install Node.js and bun, then install dependencies"

runs:
  using: "composite"
  steps:
    - uses: "moonrepo/setup-toolchain@v0.6.4"
      with:
        auto-install: true
        cache-base: main
        cache-version: v2-${{ hashFiles('.prototools') }}

    # proto lists a tool as installed from its manifest even when an
    # interrupted unpack left the executable missing (proto::locate::
    # missing_executable), and auto-install never repairs that. Reinstall
    # any pinned tool whose binary is absent.
    - name: Verify toolchain
      shell: bash
      run: |
        for tool in node bun moon; do
          proto bin "$tool" > /dev/null 2>&1 || proto install "$tool" --force
        done

    - name: Cache Bun dependencies
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}

    - name: "Install dependencies"
      shell: bash
      run: "bun install"
