name: "Deploy"
description: "Build a website once, then create its Workers Preview (pull requests) or upload its staging Version and save the build for production promotion"

inputs:
  mode:
    description: "preview (pull request) or staging (push to main)"
    required: true
  target:
    description: "The website to deploy (ex: clinicamauricioaraujo)"
    required: true
  pr:
    description: "Pull request number (required when mode=preview; names Preview pr-<N>)"
    required: false
  access-team-domain:
    description: "Cloudflare Access team hostname or URL, used only for selected preview builds"
    required: false
  access-client-id:
    description: "Cloudflare Access service token ID used to run the EmDash setup on selected previews"
    required: false
  access-client-secret:
    description: "Cloudflare Access service token secret used to run the EmDash setup on selected previews"
    required: false
  infisical-identity-id:
    description: "Infisical machine identity (OIDC auth) that may read the staging secrets of the site; required when the site declares secrets"
    required: false
  infisical-project-slug:
    description: "Infisical project slug holding the sites' runtime secrets under /websites/<target>"
    required: false
  infisical-domain:
    description: "Infisical instance URL; empty for https://app.infisical.com"
    required: false

  images-base-url:
    description: "Image service base URL from the job's GitHub environment secret IMAGES_BASE_URL"
    required: false

outputs:
  url:
    description: "The Workers Preview URL (pull requests only)"
    value: ${{ steps.preview.outputs.deploy-url }}

runs:
  using: "composite"
  steps:
    - name: Fetch staging secrets from Infisical
      if: inputs.mode == 'staging' && (inputs.target == 'brunabraz' || inputs.target == 'pedrohenridesign')
      uses: Infisical/secrets-action@v1.0.18
      with:
        method: oidc
        identity-id: ${{ inputs.infisical-identity-id }}
        project-slug: ${{ inputs.infisical-project-slug }}
        domain: ${{ inputs.infisical-domain || 'https://app.infisical.com' }}
        env-slug: staging
        secret-path: /websites/${{ inputs.target }}
        export-type: file
        file-output-path: /.site-secrets.env

    # Pedro and Bruna previews use native providers and Access; their standard
    # build remains the shared staging/production artifact with config at upload.
    - name: Build
      shell: bash
      env:
        EMDASH_BUILD_FLAVOR: ${{ (inputs.target == 'pedrohenridesign' || inputs.target == 'brunabraz') && (inputs.mode == 'preview' && 'preview' || 'standard') || '' }}
        CF_ACCESS_TEAM_DOMAIN: ${{ inputs.mode == 'preview' && (inputs.target == 'pedrohenridesign' || inputs.target == 'brunabraz') && inputs.access-team-domain || '' }}
      run: moon run ${{ inputs.target }}:build

    - name: Validate staging secrets
      if: inputs.mode == 'staging'
      shell: bash
      run: bun scripts/deploy.ts check-secrets ${{ inputs.target }} --stage staging

    - name: Create Workers Preview
      id: preview
      if: inputs.mode == 'preview'
      shell: bash
      env:
        CF_ACCESS_CLIENT_ID: ${{ inputs.access-client-id }}
        CF_ACCESS_CLIENT_SECRET: ${{ inputs.access-client-secret }}
        IMAGES_BASE_URL: ${{ inputs.images-base-url }}
      run: bun scripts/deploy.ts preview ${{ inputs.target }} --pr ${{ inputs.pr }}

    - name: Record build digest
      if: inputs.mode == 'staging'
      shell: bash
      run: bun scripts/deploy.ts digest websites/${{ inputs.target }}/dist > websites/${{ inputs.target }}/dist.sha256

    - name: Save build for production promotion
      if: inputs.mode == 'staging'
      uses: actions/upload-artifact@v7
      with:
        name: website-dist-${{ inputs.target }}-${{ github.sha }}
        path: |
          websites/${{ inputs.target }}/dist
          websites/${{ inputs.target }}/dist.sha256
          websites/${{ inputs.target }}/.emdash/migrations.json
        include-hidden-files: true
        if-no-files-found: error

    # Core migrations run before the new Version exists, so a Worker that only
    # checks (migrations.runtime: "check") never meets an unmigrated database.
    - name: Apply EmDash migrations (staging)
      if: inputs.mode == 'staging' && (inputs.target == 'pedrohenridesign' || inputs.target == 'brunabraz')
      shell: bash
      run: >-
        bun scripts/deploy.ts migrate ${{ inputs.target }}
        --stage staging
        --manifest websites/${{ inputs.target }}/.emdash/migrations.json

    - name: Upload staging Version
      id: staging
      if: inputs.mode == 'staging'
      shell: bash
      env:
        IMAGES_BASE_URL: ${{ inputs.images-base-url }}
      run: >-
        bun scripts/deploy.ts version-upload ${{ inputs.target }}
        --stage staging
        --artifact-dir websites/${{ inputs.target }}/dist

    - name: Deploy staging Version
      if: inputs.mode == 'staging'
      shell: bash
      run: >-
        bun scripts/deploy.ts version-deploy ${{ inputs.target }}
        --stage staging
        --version-id ${{ steps.staging.outputs.version-id }}
