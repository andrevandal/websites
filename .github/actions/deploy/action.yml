name: "Deploy"
description: "Checkout code, install Node.js and bun, then install dependencies"

inputs:
  env:
    description: "The environment to deploy to (ex: preview [default], staging, production)"
    required: false
  target:
    description: "The app or website to deploy (ex: clinicamauricioaraujo.com.br)"
    required: true
  pr:
    description: "Pull request number (required when env=preview)"
    required: false

outputs:
  url:
    description: "The deployed worker's URL (workers.dev, or its production custom domain when one is configured)"
    value: ${{ steps.deploy.outputs.deploy-url }}
  custom-domain:
    description: "The worker's production custom domain, when one is configured (production env only)"
    value: ${{ steps.deploy.outputs.custom-domain }}

runs:
  using: "composite"
  steps:
    - name: Prepare build environment
      shell: bash
      run: bun run prepare-build-env ${{ inputs.target }}

    - name: Build
      shell: bash
      run: moon run ${{ inputs.target }}:build

    - name: Deploy
      id: deploy
      shell: bash
      run: bun run deploy ${{ inputs.target }} --env ${{ inputs.env }} ${{ inputs.pr && format('--pr {0}', inputs.pr) || '' }} --no-dry-run
