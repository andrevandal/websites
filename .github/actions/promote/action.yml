name: "Promote"
description: "Upload a website's staging build from Main CI as a production-configured Version, then send it 100% of traffic. Never rebuilds."

inputs:
  target:
    description: "The website to promote (ex: vandallabs)"
    required: true
  sha:
    description: "Commit whose Main CI build artifact (website-dist-<target>-<sha>) is promoted"
    required: true
  github-token:
    description: "Token with actions: read, used to find the Main CI run and download its artifact"
    required: true
  infisical-identity-id:
    description: "Infisical machine identity (OIDC auth) that may read the production secrets of the site; required when the site declares secrets"
    required: false
  infisical-project-slug:
    description: "Infisical project slug holding the sites' runtime secrets under /websites/<target>"
    required: false
  infisical-domain:
    description: "Infisical instance URL; empty for https://app.infisical.com"
    required: false

outputs:
  version-id:
    description: "The production Version now serving 100% of traffic"
    value: ${{ steps.upload.outputs.version-id }}
  custom-domain:
    description: "The site's dashboard-managed production custom domain, when configured"
    value: ${{ steps.deploy.outputs.custom-domain }}

runs:
  using: "composite"
  steps:
    # Fails before waiting for Main CI when a production secret is absent.
    - name: Fetch production secrets from Infisical
      if: inputs.target == 'pedrohenri'
      uses: Infisical/secrets-action@v1.0.18
      with:
        method: oidc
        identity-id: ${{ inputs.infisical-identity-id }}
        project-slug: ${{ inputs.infisical-project-slug }}
        domain: ${{ inputs.infisical-domain || 'https://app.infisical.com' }}
        env-slug: production
        secret-path: /websites/${{ inputs.target }}

    - name: Validate production secrets
      shell: bash
      run: bun scripts/deploy.ts check-secrets ${{ inputs.target }} --stage production

    - name: Wait for Main CI
      id: main-ci
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SHA: ${{ inputs.sha }}
      run: |
        failure="Main CI did not complete successfully for ${SHA}; no staging artifact is available for production promotion."
        deadline=$((SECONDS + 1800))
        while :; do
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow main.yml --commit "$SHA" --event push \
            --json databaseId,status,conclusion --limit 1 --jq '.[0] // empty')
          if [ -n "$run" ] && [ "$(jq -r .status <<<"$run")" = "completed" ]; then
            if [ "$(jq -r .conclusion <<<"$run")" = "success" ]; then
              echo "run-id=$(jq -r .databaseId <<<"$run")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::$failure"
            exit 1
          fi
          if [ "$SECONDS" -ge "$deadline" ]; then
            echo "::error::$failure"
            exit 1
          fi
          sleep 30
        done

    - name: Download staging build
      uses: actions/download-artifact@v8
      with:
        name: website-dist-${{ inputs.target }}-${{ inputs.sha }}
        run-id: ${{ steps.main-ci.outputs.run-id }}
        github-token: ${{ inputs.github-token }}
        path: ${{ runner.temp }}/website-dist

    - name: Verify build digest
      shell: bash
      run: |
        expected=$(cat "$RUNNER_TEMP/website-dist/dist.sha256")
        actual=$(bun scripts/deploy.ts digest "$RUNNER_TEMP/website-dist/dist")
        if [ "$expected" != "$actual" ]; then
          echo "::error::Restored build digest $actual does not match the Main CI digest $expected."
          exit 1
        fi
        echo "Build digest $actual matches Main CI."

    # Core migrations run before the new Version exists, so a Worker that only
    # checks (migrations.runtime: "check") never meets an unmigrated database.
    - name: Apply EmDash migrations (production)
      if: inputs.target == 'pedrohenri'
      shell: bash
      run: >-
        bun scripts/deploy.ts migrate ${{ inputs.target }}
        --stage production
        --manifest "$RUNNER_TEMP/website-dist/.emdash/migrations.json"

    - name: Upload production Version
      id: upload
      shell: bash
      run: >-
        bun scripts/deploy.ts version-upload ${{ inputs.target }}
        --stage production
        --artifact-dir "$RUNNER_TEMP/website-dist/dist"

    - name: Deploy production Version
      id: deploy
      shell: bash
      run: bun scripts/deploy.ts version-deploy ${{ inputs.target }} --stage production --version-id ${{ steps.upload.outputs.version-id }}
