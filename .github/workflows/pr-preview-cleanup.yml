name: Cleanup PR Preview

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: pr-preview-cleanup-${{ github.event.pull_request.number }}

jobs:
  cleanup:
    name: Delete PR preview deployments
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          [brunabraz, clinicamauricioaraujo.com.br, transportugal, vandallabs]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Init
        uses: ./.github/actions/init

      - name: Cleanup
        run: bun scripts/deploy.ts cleanup ${{ matrix.target }} --pr ${{ github.event.pull_request.number }} --no-dry-run
