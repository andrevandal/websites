name: Cleanup PR Preview Resources

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: pr-preview-cleanup-${{ github.event.pull_request.number }}

jobs:
  cleanup:
    name: Delete Preview and PR resources pr-${{ github.event.pull_request.number }}
    # Matches main.yml: fork PRs never get a Preview or Cloudflare credentials.
    # Every target removes SESSION KV; Pedro and Bruna also remove D1 and nonempty R2.
    if: ${{ github.event.repository.fork == false && (github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            bellypao,
            brunabraz,
            clinicamauricioaraujo,
            gruice,
            pedrohenridesign,
            transportugal,
            vandallabs,
          ]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Init
        uses: ./.github/actions/init

      - name: Cleanup Preview and PR resources
        run: bun scripts/deploy.ts cleanup ${{ matrix.target }} --pr ${{ github.event.pull_request.number }}
