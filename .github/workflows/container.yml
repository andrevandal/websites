name: Container

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
        required: true

permissions:
  contents: read

# Keyed by environment too: Main CI's staging build and release.yml's
# production dispatch both run on refs/heads/main, and a shared group let the
# staging run cancel the production deploy.
concurrency:
  group: images-container-${{ inputs.environment }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/images-app
  DOCKERFILE: docker/images.Dockerfile
  BUILD_CACHE_SCOPE: images-container-v2

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Init
        uses: ./.github/actions/init

      - name: Typecheck app
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: moon run images:typecheck

      - name: Test app
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: moon run images:test

      - name: Build app
        run: moon run images:build

  build-and-push:
    runs-on: ubuntu-26.04
    needs: verify
    if: ${{ github.event.repository.fork == false && (always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped')) }}
    permissions:
      contents: read
      packages: write
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      # GitHub-hosted ubuntu-26.04 runners have preinstalled toolchains
      # (Android SDK, .NET, Haskell, etc.) consuming a large chunk of the
      # ~14GB nominally free disk. This monorepo's multi-stage Docker build
      # plus `cache-to: type=gha,mode=max` (which materializes every layer
      # of every stage locally before exporting) has exhausted that budget
      # in production ("No space left on device" mid-build) -- none of the
      # removed toolchains are used by this job (it only runs Docker Buildx,
      # no local Bun/Node build step).
      #
      # Only the fast, high-yield removals are kept. Earlier runner measurements:
      # Android 11GiB in ~40s, .NET 5.7GiB, Haskell 3.6GiB: ~20GiB freed.
      # `large-packages` (apt remove, ~50s for 4.5GiB) and `docker-images`
      # (~15s for 1.9GiB) cost about a minute for ~6GiB, so they stay off.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2
        with:
          preinstalled-runtimes: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Init
        uses: ./.github/actions/init

      # Writes the workspace manifests and lockfile images.Dockerfile
      # installs from, so the Dockerfile needs no hand-kept package list.
      - name: Scaffold Docker workspace
        run: moon docker scaffold images

      - name: Set environment
        id: env
        shell: bash
        run: echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        id: meta
        shell: bash
        run: |
          version="$(jq -r '.version' apps/images/package.json)"
          image="${REGISTRY}/${IMAGE_NAME}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pr="${{ github.event.pull_request.number }}"
            tag="$version-preview-$pr"
            {
              echo "tags<<EOF"
              echo "$image:$tag"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.env.outputs.environment }}" = "production" ]; then
            {
              echo "tags<<EOF"
              echo "$image:$version"
              echo "$image:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            tag="$version-staging"
            {
              echo "tags<<EOF"
              echo "$image:$tag"
              echo "$image:staging"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # images.Dockerfile declares no secret mounts and ignores these; kept
      # wired for parity with the moon remote-cache ADR's mechanism.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ env.BUILD_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.BUILD_CACHE_SCOPE }}
          secrets: |
            moon_remote_host=${{ secrets.MOON_REMOTE_HOST }}
            moon_remote_user=${{ secrets.MOON_REMOTE_HOST_USERNAME }}
            moon_remote_pass=${{ secrets.MOON_REMOTE_HOST_PASSWORD }}

  deploy:
    runs-on: ubuntu-26.04
    needs: build-and-push
    if: ${{ github.event.repository.fork == false && (needs.build-and-push.outputs.environment != 'preview') }}
    permissions: {}
    environment:
      name: ${{ needs.build-and-push.outputs.environment }}
    steps:
      - name: Trigger Coolify deploy
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_IMAGES_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          CF_BYPASS_SECRET: ${{ secrets.CLOUDFLARE_DEPLOY_BYPASS_SECRET }}
          ENVIRONMENT: ${{ needs.build-and-push.outputs.environment }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "Coolify webhook is not configured for $ENVIRONMENT" >&2
            exit 1
          fi

          http_status=$(curl -sS -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "X-Coolify-Deploy-Bypass: $CF_BYPASS_SECRET" \
            -o /tmp/coolify-response.json \
            -w "%{http_code}")

          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "Coolify webhook returned HTTP $http_status" >&2
            cat /tmp/coolify-response.json >&2
            exit 1
          fi

          cat /tmp/coolify-response.json
