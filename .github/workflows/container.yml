name: Container

on:
  workflow_call:
    inputs:
      app:
        description: Container app to build (web or images)
        type: string
        required: true
      environment:
        description: Target environment
        type: string
        required: true
  workflow_dispatch:
    inputs:
      app:
        description: Container app to build
        type: choice
        options: [web, images]
        default: web
        required: true
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ inputs.app }}-container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GitHub Actions expressions have no case/format transform, so every
  # per-app value is a static ternary on the `app` input - never a
  # string-interpolated name.
  IMAGE_NAME: ${{ github.repository }}/${{ inputs.app == 'web' && 'web-app' || 'images-app' }}
  DOCKERFILE: ${{ inputs.app == 'web' && 'docker/web.Dockerfile' || 'docker/images.Dockerfile' }}
  BUILD_CACHE_SCOPE: ${{ inputs.app == 'web' && 'web-container-v1' || 'images-container-v2' }}

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Init
        uses: ./.github/actions/init

      - name: Typecheck app
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: moon run ${{ inputs.app }}:typecheck

      - name: Test app
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: moon run ${{ inputs.app }}:test

      - name: Build app
        run: moon run ${{ inputs.app }}:build

  build-and-push:
    runs-on: ubuntu-latest
    needs: verify
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set environment
        id: env
        shell: bash
        run: echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        id: meta
        shell: bash
        run: |
          version="$(jq -r '.version' apps/${{ inputs.app }}/package.json)"
          image="${REGISTRY}/${IMAGE_NAME}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pr="${{ github.event.pull_request.number }}"
            tag="$version-preview-$pr"
            {
              echo "tags<<EOF"
              echo "$image:$tag"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.env.outputs.environment }}" = "production" ]; then
            {
              echo "tags<<EOF"
              echo "$image:$version"
              echo "$image:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            tag="$version-staging"
            {
              echo "tags<<EOF"
              echo "$image:$tag"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The moon remote-cache secrets are consumed only by
      # docker/web.Dockerfile's builder stage; images.Dockerfile declares no
      # secret mounts and ignores them.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ env.BUILD_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.BUILD_CACHE_SCOPE }}
          secrets: |
            moon_remote_host=${{ vars.MOON_REMOTE_HOST }}
            moon_remote_user=${{ secrets.BAZEL_REMOTE_BASIC_AUTH_USERNAME }}
            moon_remote_pass=${{ secrets.BAZEL_REMOTE_BASIC_AUTH_PASSWORD }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.outputs.environment != 'preview'
    environment:
      name: ${{ needs.build-and-push.outputs.environment }}
    steps:
      - name: Trigger Coolify deploy
        shell: bash
        env:
          WEBHOOK_URL: ${{ inputs.app == 'web' && secrets.COOLIFY_WEB_WEBHOOK || secrets.COOLIFY_IMAGES_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          CF_BYPASS_SECRET: ${{ secrets.CLOUDFLARE_DEPLOY_BYPASS_SECRET }}
          ENVIRONMENT: ${{ needs.build-and-push.outputs.environment }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "Coolify webhook is not configured for $ENVIRONMENT" >&2
            exit 1
          fi

          http_status=$(curl -sS -X GET "$WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "X-Coolify-Deploy-Bypass: $CF_BYPASS_SECRET" \
            -o /tmp/coolify-response.json \
            -w "%{http_code}")

          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "Coolify webhook returned HTTP $http_status" >&2
            cat /tmp/coolify-response.json >&2
            exit 1
          fi

          cat /tmp/coolify-response.json
