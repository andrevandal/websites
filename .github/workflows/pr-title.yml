name: PR Title

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  contents: read

jobs:
  validate:
    name: Conventional Commit
    if: github.event.repository.fork == false
    permissions:
      pull-requests: write
      statuses: write
    runs-on: ubuntu-slim
    # pull_request_target reads metadata only; never check out or run PR code.
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          wip: true
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            doesn't match the expected pattern. The subject must start lowercase.
