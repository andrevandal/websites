name: Main CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check-all:
    name: Check all affected apps and packages
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      affected_apps: ${{ steps.affecteds.outputs.apps_affected }}
      container_apps_affected: ${{ steps.affecteds.outputs.container_apps_affected }}
      env_to_deploy: ${{ steps.affecteds.outputs.env_to_deploy }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Init
        uses: ./.github/actions/init

      - name: Validate release config
        run: bun scripts/validate-release-config.ts

      - name: Check root files
        run: |
          bunx oxlint scripts .omp *.ts --report-unused-disable-directives
          bunx oxfmt --check \
            scripts docs docker .agents .github .moon .vscode .omp \
            *.ts *.md *.json *.yml \
            .gitguardian.yml .oxfmtrc.json .oxlintrc.json \
            .release-please-manifest.json
          bun run test:scripts
          bun run docs
          bun scripts/coverage-allowlist-guard.ts

      # Writes moon's `remote:` block into this runner's ephemeral checkout.
      # Never committed. Fork PRs receive no repository secrets, so test
      # all three values before
      # invoking the strict config writer; missing credentials degrade to local
      # execution instead of breaking the PR.
      - name: Configure remote cache
        if: >-
          github.repository == 'andrevandal/websites' && vars.ENABLE_DEPLOY == 'true' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        env:
          MOON_REMOTE_HOST: ${{ secrets.MOON_REMOTE_HOST }}
          MOON_REMOTE_API: ${{ secrets.MOON_REMOTE_API }}
          BAZEL_REMOTE_BASIC_AUTH_USERNAME: ${{ secrets.BAZEL_REMOTE_BASIC_AUTH_USERNAME }}
          BAZEL_REMOTE_BASIC_AUTH_PASSWORD: ${{ secrets.BAZEL_REMOTE_BASIC_AUTH_PASSWORD }}
        run: |
          if [ -z "$MOON_REMOTE_HOST" ] || \
             [ -z "$BAZEL_REMOTE_BASIC_AUTH_USERNAME" ] || \
             [ -z "$BAZEL_REMOTE_BASIC_AUTH_PASSWORD" ]; then
            echo "Remote cache credentials unavailable - continuing without remote cache"
            exit 0
          fi
          bun scripts/ci/write-remote-cache-config.ts

      - name: Run affected checks
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: moon ci :lint :format :typecheck :test :coverage

      - name: CI report summary
        if: always()
        run: bun scripts/ci/ci-report-summary.ts

      - name: Get affected apps
        id: affecteds
        run: |
          # "images" deploys via the reusable container workflow
          # (.github/workflows/container.yml — Docker/GHCR/Coolify), not this
          # generic Cloudflare deploy job — always excluded from `apps`, and
          # listed separately in `container_apps_affected` for the matrix.
          affected="$(moon query projects "projectLayer=application" --affected --downstream deep | jq -r '.projects | map(.source) | map(sub("^apps/|^websites/"; ""))')"
          apps=$(echo "$affected" | jq -c 'map(select(. != "images"))')
          container_apps=$(echo "$affected" | jq -c 'map(select(. == "images"))')
          echo "apps_affected=$apps" >> $GITHUB_OUTPUT
          echo "container_apps_affected=$container_apps" >> $GITHUB_OUTPUT

  deploy:
    # Pull requests get a Workers Preview; main uploads a staging Version and
    # saves the build that release.yml later promotes to production.
    name: Deploy (Preview or staging Version)
    needs: check-all
    # Fork PRs receive no Cloudflare credentials, so only same-repository PRs
    # get a Workers Preview.
    if: >-
      github.repository == 'andrevandal/websites' && vars.ENABLE_DEPLOY == 'true' &&
      (needs.check-all.outputs.affected_apps != '[]' &&
      github.head_ref != 'release-please--branches--main' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-26.04
    # id-token: Infisical OIDC login on main; previews fetch no secrets.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    environment: ${{ github.ref == 'refs/heads/main' && 'staging' || 'preview' }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.check-all.outputs.affected_apps) }}

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Init
        uses: ./.github/actions/init

      - name: Deploy
        id: deploy
        uses: ./.github/actions/deploy
        with:
          mode: ${{ github.ref == 'refs/heads/main' && 'staging' || 'preview' }}
          target: ${{ matrix.app }}
          pr: ${{ github.event.pull_request.number }}
          access-team-domain: ${{ github.ref != 'refs/heads/main' && (matrix.app == 'pedrohenridesign' || matrix.app == 'brunabraz') && secrets.CF_ACCESS_TEAM_DOMAIN || '' }}
          access-client-id: ${{ github.ref != 'refs/heads/main' && (matrix.app == 'pedrohenridesign' || matrix.app == 'brunabraz') && secrets.CF_ACCESS_CLIENT_ID || '' }}
          access-client-secret: ${{ github.ref != 'refs/heads/main' && (matrix.app == 'pedrohenridesign' || matrix.app == 'brunabraz') && secrets.CF_ACCESS_CLIENT_SECRET || '' }}
          infisical-identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          infisical-project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          infisical-domain: ${{ vars.INFISICAL_DOMAIN }}
          images-base-url: ${{ secrets.IMAGES_BASE_URL }}

      - name: Lighthouse CI against the preview deploy
        id: lhci
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          # Selected EmDash previews sit behind Cloudflare Access. Lighthouse
          # audits a local proxy that adds the Service Auth token, so the token
          # never reaches the browser, other origins or the report.
          ACCESS_PROTECTED: ${{ matrix.app == 'pedrohenridesign' || matrix.app == 'brunabraz' }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          audit_url="$PREVIEW_URL"
          secret=""
          if [ "$ACCESS_PROTECTED" = "true" ]; then
            if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
              echo "::warning::Skipping Lighthouse: ${{ matrix.app }} previews are behind Cloudflare Access and CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET are not set"
              exit 0
            fi
            secret="$CF_ACCESS_CLIENT_SECRET"
            ACCESS_PROXY_TARGET="$PREVIEW_URL" ACCESS_PROXY_PORT=8788 \
              bun scripts/ci/access-proxy.ts &
            proxy_pid=$!
            trap 'kill "$proxy_pid"' EXIT
            # only the proxy gets the token; Lighthouse and Chrome never see it
            unset CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET
            for _ in $(seq 1 30); do
              curl -s -o /dev/null http://127.0.0.1:8788/ && break
              sleep 1
            done
            audit_url="http://127.0.0.1:8788/"
          fi
          bunx @lhci/cli@0.14.x collect --url="$audit_url"
          # the report below goes to public storage: fail closed if the token
          # is anywhere in the results
          if [ -n "$secret" ] && grep -rqF -- "$secret" .lighthouseci; then
            echo "::error::The Access service token is in the Lighthouse results; not uploading"
            exit 1
          fi
          bunx @lhci/cli@0.14.x upload \
            --upload.target=temporary-public-storage | tee lhci-output.txt
          report_url=$(grep -oE 'https://storage\.googleapis\.com/lighthouse[^ ]+\.html' lhci-output.txt | tail -1)
          echo "report-url=${report_url}" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: preview-url-${{ matrix.app }}
          message: |
            ### Workers Preview `pr-${{ github.event.pull_request.number }}`: `${{ matrix.app }}`
            :rocket: ${{ steps.deploy.outputs.url }}

            ${{ steps.lhci.outputs['report-url'] && format('Lighthouse report: {0}', steps.lhci.outputs['report-url']) || '' }}

  # A release PR only bumps versions and changelogs, so main's staging deploy
  # already holds its code: link that instead of building a Preview.
  release-staging-links:
    name: Link staging (release PR)
    needs: check-all
    if: >-
      github.repository == 'andrevandal/websites' && vars.ENABLE_DEPLOY == 'true' &&
      (needs.check-all.outputs.affected_apps != '[]' &&
      github.event_name == 'pull_request' &&
      github.head_ref == 'release-please--branches--main') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.check-all.outputs.affected_apps) }}
    steps:
      - name: Comment staging URL on the PR
        if: vars.CLOUDFLARE_WORKERS_SUBDOMAIN != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: preview-url-${{ matrix.app }}
          message: |
            ### Staging: `${{ matrix.app }}`
            :rocket: https://${{ matrix.app }}-staging.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev

  container:
    name: Container (images)
    needs: check-all
    # The images container gets staging (push to main) and production
    # (release.yml's manual dispatch) deploys only -- no PR preview build,
    # unlike the websites' `deploy` job above.
    if: >-
      github.repository == 'andrevandal/websites' && vars.ENABLE_DEPLOY == 'true' &&
      (needs.check-all.outputs.container_apps_affected != '[]' && github.event_name != 'pull_request')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    secrets: inherit
    with:
      environment: staging
