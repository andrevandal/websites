name: Main CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check-all:
    name: Check all affected apps and packages
    runs-on: ubuntu-latest
    outputs:
      affected_apps: ${{ steps.affecteds.outputs.apps_affected }}
      env_to_deploy: ${{ steps.affecteds.outputs.env_to_deploy }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Init
        uses: ./.github/actions/init
        with:
          fetch-depth: 0

      - name: Validate release config
        run: bun scripts/validate-release-config.ts

      - name: Run CI checks
        run: moon ci :format :lint :testci :typecheck

      - name: Get affected apps
        id: affecteds
        run: |
          echo "apps_affected=$(moon query projects --affected --downstream deep --alias "(websites|apps)/*" | jq '[.[] | sub("^apps/|^websites/"; "")]'" >> $GITHUB_OUTPUT
          echo "env_to_deploy=${{ github.ref == 'refs/heads/main' && 'staging' || 'dev' }}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploying ${{ matrix.app }}'s preview to ${{ needs.check-all.outputs.env_to_deploy }}
    needs: check-all
    if: |
      needs.check-all.outputs.affected_apps != '[]' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.check-all.outputs.affected_apps) }}

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Deploy
        uses: ./.github/actions/deploy
        with:
          env: ${{ needs.check-all.outputs.env_to_deploy }}
          target: ${{ matrix.app }}
