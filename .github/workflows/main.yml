name: Main CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check-all:
    name: Check all affected apps and packages
    runs-on: ubuntu-latest
    outputs:
      affected_apps: ${{ steps.affecteds.outputs.apps_affected }}
      env_to_deploy: ${{ steps.affecteds.outputs.env_to_deploy }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Init
        uses: ./.github/actions/init

      - name: Validate release config
        run: bun scripts/validate-release-config.ts

      - name: Run CI checks
        run: bun run check

      - name: Build packages
        run: moon run :build --query "projectLayer=library"

      - name: Test
        run: bun run test

      - name: Get affected apps
        id: affecteds
        run: |
          apps=$(moon query projects "projectLayer=application" --affected --downstream deep | jq -r '.projects | map(.source) | map(sub("^apps/|^websites/"; "")) | tojson')
          echo "apps_affected=$apps" >> $GITHUB_OUTPUT

  deploy:
    name: Deploying preview
    needs: check-all
    if: needs.check-all.outputs.affected_apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.check-all.outputs.affected_apps) }}
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'staging' || 'preview' }}
      deployment: false

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ENV_VARS_BRUNABRAZ: ${{ vars.ENV_VARS_BRUNABRAZ }}
      ENV_VARS_CLINICAMAURICIOARAUJO: ${{ vars.ENV_VARS_CLINICAMAURICIOARAUJO }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Init
        uses: ./.github/actions/init

      - name: Deploy
        uses: ./.github/actions/deploy
        with:
          env: ${{ github.ref == 'refs/heads/main' && 'staging' || 'preview' }}
          target: ${{ matrix.app }}
