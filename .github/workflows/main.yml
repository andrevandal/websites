name: Main CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check-all:
    name: Check all affected apps and packages
    runs-on: ubuntu-latest
    outputs:
      affected_apps: ${{ steps.affecteds.outputs.apps_affected }}
      images_affected: ${{ steps.affecteds.outputs.images_affected }}
      web_affected: ${{ steps.affecteds.outputs.web_affected }}
      env_to_deploy: ${{ steps.affecteds.outputs.env_to_deploy }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Init
        uses: ./.github/actions/init

      - name: Validate release config
        run: bun scripts/validate-release-config.ts

      - name: Run CI checks
        run: bun run check

      - name: Build packages
        run: moon run :build --query "projectLayer=library"

      - name: Test
        run: bun run test

      - name: Get affected apps
        id: affecteds
        run: |
          # "images" and "web" are each deployed via their own dedicated
          # workflow (.github/workflows/images-container.yml,
          # .github/workflows/web-container.yml — Docker/GHCR/Coolify), not
          # this generic Cloudflare deploy job — always excluded here.
          affected="$(moon query projects "projectLayer=application" --affected --downstream deep | jq -r '.projects | map(.source) | map(sub("^apps/|^websites/"; ""))')"
          apps=$(echo "$affected" | jq -c 'map(select(. != "images" and . != "web"))')
          images_affected=$(echo "$affected" | jq 'any(. == "images")')
          web_affected=$(echo "$affected" | jq 'any(. == "web")')
          echo "apps_affected=$apps" >> $GITHUB_OUTPUT
          echo "images_affected=$images_affected" >> $GITHUB_OUTPUT
          echo "web_affected=$web_affected" >> $GITHUB_OUTPUT

  deploy:
    name: Deploying preview
    needs: check-all
    if: needs.check-all.outputs.affected_apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.check-all.outputs.affected_apps) }}
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'staging' || 'preview' }}
      deployment: false

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'staging' || 'preview' }}
      ENV_VARS_BRUNABRAZ: ${{ vars.ENV_VARS_BRUNABRAZ }}
      ENV_VARS_CLINICAMAURICIOARAUJO: ${{ vars.ENV_VARS_CLINICAMAURICIOARAUJO }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Init
        uses: ./.github/actions/init

      - name: Deploy
        uses: ./.github/actions/deploy
        with:
          env: ${{ github.ref == 'refs/heads/main' && 'staging' || 'preview' }}
          target: ${{ matrix.app }}

  images-container:
    name: Images container
    needs: check-all
    if: needs.check-all.outputs.images_affected == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images-container.yml
    secrets: inherit
    with:
      environment: ${{ github.event_name == 'pull_request' && 'preview' || (github.ref == 'refs/heads/main' && 'staging' || 'preview') }}

  web-container:
    name: Web container
    needs: check-all
    if: needs.check-all.outputs.web_affected == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/web-container.yml
    secrets: inherit
    with:
      environment: ${{ github.event_name == 'pull_request' && 'preview' || (github.ref == 'refs/heads/main' && 'staging' || 'preview') }}
