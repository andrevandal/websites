name: Main CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check-all:
    name: Test
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      affected-websites: ${{ steps.websites.outputs.matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Validate release config
        run: bun scripts/validate-release-config.ts

      - name: Run CI checks
        run: moon ci :format :lint :testci :typecheck

      - name: Get affected websites
        id: websites
        run: |
          MATRIX=$(moon query projects --affected | jq -c '[.projects[] | select(any(.aliases[]; .alias | startswith("@websites/"))) | .id]')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  deploy-main-preview:
    name: Preview main / ${{ matrix.website }}
    needs: check-all
    if: |
      needs.check-all.outputs.affected-websites != '[]' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        website: ${{ fromJson(needs.check-all.outputs.affected-websites) }}

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build
        run: moon run ${{ matrix.website }}:build

      - name: Deploy to Cloudflare Pages (main preview)
        run: |
          PROJECT_NAME=$(jq -r '.name' "websites/${{ matrix.website }}/wrangler.json")
          bunx wrangler pages deploy "websites/${{ matrix.website }}/dist" \
            --project-name "$PROJECT_NAME" \
            --branch "main"

  deploy-websites:
    name: Deploy ${{ matrix.website }}
    needs: check-all
    if: |
      needs.check-all.outputs.affected-websites != '[]' &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        website: ${{ fromJson(needs.check-all.outputs.affected-websites) }}

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_BRANCH: ${{ github.head_ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build
        run: moon run ${{ matrix.website }}:build

      - name: Deploy to Cloudflare Pages
        run: |
          PROJECT_NAME=$(jq -r '.name' "websites/${{ matrix.website }}/wrangler.json")
          DEPLOY_OUTPUT=$(bunx wrangler pages deploy "websites/${{ matrix.website }}/dist" \
            --project-name "$PROJECT_NAME" \
            --branch "$DEPLOY_BRANCH" 2>&1)
          echo "$DEPLOY_OUTPUT"
          PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[^ ]+\.pages\.dev')
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "Deploy preview (${{ matrix.website }}): $PREVIEW_URL"
