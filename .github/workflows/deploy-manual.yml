name: Deploy Manual

on:
  workflow_dispatch:
    inputs:
      target:
        description: App or website to deploy
        type: choice
        options:
          [
            images,
            bellypao,
            brunabraz,
            clinicamauricioaraujo.com.br,
            transportugal,
            vandallabs,
          ]
        required: true
      environment:
        description: Target environment (websites accept only production; their staging comes from Main CI)
        type: choice
        options: [staging, production]
        default: staging
        required: true
      artifact-sha:
        description: Websites only - commit SHA whose Main CI build (artifact website-dist-<target>-<sha>) to promote
        type: string
        required: false

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: deploy-manual-${{ inputs.target }}-${{ inputs.environment }}

jobs:
  deploy-container:
    name: Deploy container
    if: inputs.target == 'images'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}

  deploy-website:
    name: Promote website build to production
    if: inputs.target != 'images'
    runs-on: ubuntu-26.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate inputs
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ARTIFACT_SHA: ${{ inputs.artifact-sha }}
        run: |
          if [ "$ENVIRONMENT" != "production" ]; then
            echo "::error::Websites deploy manually only to production; staging Versions come from Main CI on main."
            exit 1
          fi
          if [ -z "$ARTIFACT_SHA" ]; then
            echo "::error::artifact-sha is required: the commit whose Main CI build to promote."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.artifact-sha }}
          fetch-depth: 0

      - name: Init
        uses: ./.github/actions/init

      - name: Promote staging build to production
        uses: ./.github/actions/promote
        with:
          target: ${{ inputs.target }}
          sha: ${{ inputs.artifact-sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
