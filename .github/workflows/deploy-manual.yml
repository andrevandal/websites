name: Deploy Manual

on:
  workflow_dispatch:
    inputs:
      target:
        description: App or website to deploy
        type: choice
        options:
          [
            images,
            bellypao,
            brunabraz,
            clinicamauricioaraujo,
            pedrohenridesign,
            transportugal,
            vandallabs,
          ]
        required: true
      environment:
        description: Target environment (websites to staging build the selected ref without CI; to production promote a Main CI build)
        type: choice
        options: [staging, production]
        default: staging
        required: true
      artifact-sha:
        description: Websites to production only - commit SHA whose Main CI build (artifact website-dist-<target>-<sha>) to promote
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-manual-${{ inputs.target }}-${{ inputs.environment }}

jobs:
  deploy-container:
    name: Deploy container
    if: ${{ github.event.repository.fork == false && (inputs.target == 'images') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}

  deploy-website-staging:
    name: Build and deploy website to staging
    if: ${{ github.event.repository.fork == false && inputs.target != 'images' && inputs.environment == 'staging' }}
    environment: staging
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Init
        uses: ./.github/actions/init

      - name: Deploy
        uses: ./.github/actions/deploy
        with:
          mode: staging
          target: ${{ inputs.target }}
          infisical-identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          infisical-project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          infisical-domain: ${{ vars.INFISICAL_DOMAIN }}
          images-base-url: ${{ secrets.IMAGES_BASE_URL }}

      - name: Summarize deployed URL
        env:
          SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ -n "$SUBDOMAIN" ]; then url="https://$TARGET-staging.$SUBDOMAIN.workers.dev"
          else url="(set CLOUDFLARE_WORKERS_SUBDOMAIN to show the workers.dev URL)"; fi
          echo "Staging $TARGET: $url" >> "$GITHUB_STEP_SUMMARY"

  deploy-website:
    name: Promote website build to production
    if: ${{ github.event.repository.fork == false && inputs.target != 'images' && inputs.environment == 'production' }}
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: ubuntu-26.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate inputs
        env:
          ARTIFACT_SHA: ${{ inputs.artifact-sha }}
        run: |
          if [ -z "$ARTIFACT_SHA" ]; then
            echo "::error::artifact-sha is required: the commit whose Main CI build to promote."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.artifact-sha }}
          fetch-depth: 0

      - name: Init
        uses: ./.github/actions/init

      - name: Promote staging build to production
        id: promote
        uses: ./.github/actions/promote
        with:
          target: ${{ inputs.target }}
          sha: ${{ inputs.artifact-sha }}
          infisical-identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          infisical-project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          infisical-domain: ${{ vars.INFISICAL_DOMAIN }}
          images-base-url: ${{ secrets.IMAGES_BASE_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize deployed URL
        env:
          CUSTOM_DOMAIN: ${{ steps.promote.outputs.custom-domain }}
          SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then url="https://$CUSTOM_DOMAIN"
          elif [ -n "$SUBDOMAIN" ]; then url="https://$TARGET.$SUBDOMAIN.workers.dev"
          else url="(set CLOUDFLARE_WORKERS_SUBDOMAIN to show the workers.dev URL)"; fi
          echo "Production $TARGET: $url" >> "$GITHUB_STEP_SUMMARY"
