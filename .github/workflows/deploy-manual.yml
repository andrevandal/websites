name: Deploy Manual

on:
  workflow_dispatch:
    inputs:
      target:
        description: App or website to deploy
        type: choice
        options:
          [images, web, brunabraz, clinicamauricioaraujo.com.br, vandallabs]
        required: true
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-manual-${{ inputs.target }}-${{ inputs.environment }}

jobs:
  deploy-container:
    name: Deploy container
    if: inputs.target == 'images' || inputs.target == 'web'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    secrets: inherit
    with:
      app: ${{ inputs.target }}
      environment: ${{ inputs.environment }}

  deploy-website:
    name: Deploy website
    if: inputs.target != 'images' && inputs.target != 'web'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ENV_VARS_BRUNABRAZ: ${{ vars.ENV_VARS_BRUNABRAZ }}
      ENV_VARS_CLINICAMAURICIOARAUJO: ${{ vars.ENV_VARS_CLINICAMAURICIOARAUJO }}
      ENV_VARS_VANDALLABS: ${{ vars.ENV_VARS_VANDALLABS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Init
        uses: ./.github/actions/init

      - name: Deploy
        uses: ./.github/actions/deploy
        with:
          env: ${{ inputs.environment }}
          target: ${{ inputs.target }}
