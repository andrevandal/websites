name: Deploy Manual

on:
  workflow_dispatch:
    inputs:
      target:
        description: App or website to deploy
        type: choice
        options:
          [
            images,
            brunabraz,
            clinicamauricioaraujo.com.br,
            transportugal,
            vandallabs,
          ]
        required: true
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-manual-${{ inputs.target }}-${{ inputs.environment }}

jobs:
  deploy-container:
    name: Deploy container
    if: inputs.target == 'images'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}

  deploy-website:
    name: Deploy website
    if: inputs.target != 'images'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Init
        uses: ./.github/actions/init

      - name: Deploy
        uses: ./.github/actions/deploy
        with:
          env: ${{ inputs.environment }}
          target: ${{ inputs.target }}
