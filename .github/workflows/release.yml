name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      affected_apps: ${{ steps.release.outputs.affected_apps }}
      affected_packages: ${{ steps.release.outputs.affected_packages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init
        uses: ./.github/actions/init

      - name: Create Release
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get affected apps and packages
        if: steps.release.outputs.release_created == 'true'
        run: |
          apps=$(echo '${{ steps.release.outputs.paths_released }}' | jq -r 'map(select(startswith("apps/") or startswith("websites/")) | sub("^apps/|^websites/"; "")) | tojson')
          echo "affected_apps=$apps" >> $GITHUB_OUTPUT
          pkgs=$(echo '${{ steps.release.outputs.paths_released }}' | jq -r 'map(select(startswith("packages/")) | sub("^packages/"; "")) | tojson')
          echo "affected_packages=$pkgs" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Production
    needs: release
    if: ${{ needs.release.outputs.affected_apps != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.release.outputs.affected_apps) }}

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Deploy
        uses: ./.github/actions/deploy
        with:
          env: production
          target: ${{ matrix.app }}
