name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    if: ${{ github.repository == 'andrevandal/websites' && vars.ENABLE_DEPLOY == 'true' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-26.04
    outputs:
      images_release_created: ${{ steps.release.outputs['apps/images--release_created'] }}
      websites_released: ${{ steps.websites.outputs.released }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # checkout stores this token as git's credential for every later
          # push (including the grouping step's), so a bot token here makes
          # those pushes run as github-actions[bot], which GitHub holds for
          # approval.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Init
        uses: ./.github/actions/init

      - name: Create Release
        uses: googleapis/release-please-action@v5
        id: release
        with:
          # A PAT-authored release PR runs Main CI without the manual "approve
          # workflows" gate GitHub puts on github-actions[bot] PRs.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # A merge commit and its branch commits both become changelog lines, so
      # each merged PR is listed twice. Group them in the release PR's
      # changelogs and body (the body becomes the release notes): the merge
      # commit's line stays, its branch commits nest under it.
      - name: Group merge-commit entries in the release PR
        if: ${{ steps.release.outputs.pr != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          PR: ${{ fromJson(steps.release.outputs.pr || '{}').number }}
          BRANCH: ${{ fromJson(steps.release.outputs.pr || '{}').headBranchName }}
        run: |
          # Copied out first: the release branch may predate the script.
          cp scripts/release-group-merges.ts "$RUNNER_TEMP/group.ts"
          git fetch origin "$BRANCH"
          git switch -C "$BRANCH" "origin/$BRANCH"
          mapfile -t changelogs < <(git ls-files '*CHANGELOG.md')
          bun "$RUNNER_TEMP/group.ts" "${changelogs[@]}"
          if ! git diff --quiet; then
            # Authored as the PAT's owner: GitHub holds workflows triggered by a
            # github-actions[bot] commit for approval. A GITHUB_TOKEN has no
            # user, so it keeps the bot identity.
            if owner=$(gh api user --jq '"\(.login) \(.id)"' 2>/dev/null); then
              git config user.name "${owner% *}"
              git config user.email "${owner#* }+${owner% *}@users.noreply.github.com"
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            fi
            git commit -am "chore: group merge-commit entries in the changelog"
            git push origin "HEAD:$BRANCH"
          fi
          gh pr view "$PR" --json body --jq .body > "$RUNNER_TEMP/body.md"
          cp "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/body.orig.md"
          bun "$RUNNER_TEMP/group.ts" "$RUNNER_TEMP/body.md"
          if ! cmp -s "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/body.orig.md"; then
            gh pr edit "$PR" --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Compute released websites
        id: websites
        shell: bash
        run: |
          json=$(jq -nc \
            --argjson br "$([ "${{ steps.release.outputs['websites/brunabraz--release_created'] }}" = "true" ] && echo true || echo false)" \
            --argjson cl "$([ "${{ steps.release.outputs['websites/clinicamauricioaraujo--release_created'] }}" = "true" ] && echo true || echo false)" \
            --argjson tp "$([ "${{ steps.release.outputs['websites/transportugal--release_created'] }}" = "true" ] && echo true || echo false)" \
            --argjson vl "$([ "${{ steps.release.outputs['websites/vandallabs--release_created'] }}" = "true" ] && echo true || echo false)" \
            --argjson site_bellypao "$([ "${{ steps.release.outputs['websites/bellypao--release_created'] }}" = "true" ] && echo true || echo false)" \
            --argjson site_pedrohenridesign "$([ "${{ steps.release.outputs['websites/pedrohenridesign--release_created'] }}" = "true" ] && echo true || echo false)" \
            '[if $br then "brunabraz" else empty end, if $cl then "clinicamauricioaraujo" else empty end, if $tp then "transportugal" else empty end, if $vl then "vandallabs" else empty end, if $site_bellypao then "bellypao" else empty end, if $site_pedrohenridesign then "pedrohenridesign" else empty end]')
          echo "released=$json" >> "$GITHUB_OUTPUT"

  deploy-images-production:
    needs: release
    if: ${{ github.repository == 'andrevandal/websites' && vars.ENABLE_DEPLOY == 'true' && (needs.release.outputs.images_release_created == 'true') }}
    permissions:
      actions: write
    runs-on: ubuntu-26.04
    steps:
      - name: Trigger images production deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run container.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f environment=production

  # Production never rebuilds: it re-uploads Main CI's staging build for this
  # commit with production config, then promotes that new Version.
  deploy-websites-production:
    needs: release
    if: ${{ github.repository == 'andrevandal/websites' && vars.ENABLE_DEPLOY == 'true' && (needs.release.outputs.websites_released != '[]') }}
    runs-on: ubuntu-26.04
    # Runtime secrets come from Infisical over OIDC (id-token).
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.release.outputs.websites_released) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Init
        uses: ./.github/actions/init

      - name: Promote staging build to production
        uses: ./.github/actions/promote
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          infisical-identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          infisical-project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          infisical-domain: ${{ vars.INFISICAL_DOMAIN }}
          images-base-url: ${{ secrets.IMAGES_BASE_URL }}
