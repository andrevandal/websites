name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      images_release_created: ${{ steps.release.outputs['apps/images--release_created'] }}
      websites_released: ${{ steps.websites.outputs.released }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Init
        uses: ./.github/actions/init

      - name: Create Release
        uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute released websites
        id: websites
        shell: bash
        run: |
          json=$(jq -nc \
            --argjson br "$([ "${{ steps.release.outputs['websites/brunabraz--release_created'] }}" = "true" ] && echo true || echo false)" \
            --argjson cl "$([ "${{ steps.release.outputs['websites/clinicamauricioaraujo.com.br--release_created'] }}" = "true" ] && echo true || echo false)" \
            --argjson tp "$([ "${{ steps.release.outputs['websites/transportugal--release_created'] }}" = "true" ] && echo true || echo false)" \
            --argjson vl "$([ "${{ steps.release.outputs['websites/vandallabs--release_created'] }}" = "true" ] && echo true || echo false)" \
            '[if $br then "brunabraz" else empty end, if $cl then "clinicamauricioaraujo.com.br" else empty end, if $tp then "transportugal" else empty end, if $vl then "vandallabs" else empty end]')
          echo "released=$json" >> "$GITHUB_OUTPUT"

  deploy-images-production:
    needs: release
    if: ${{ needs.release.outputs.images_release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger images production deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run container.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f environment=production

  # Production never rebuilds: it re-uploads Main CI's staging build for this
  # commit with production config, then promotes that new Version.
  deploy-websites-production:
    needs: release
    if: ${{ needs.release.outputs.websites_released != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.release.outputs.websites_released) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Init
        uses: ./.github/actions/init

      - name: Promote staging build to production
        uses: ./.github/actions/promote
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
