pre-commit:
  parallel: false
  commands:
    lint:
      priority: 1
      glob: "*.{ts,tsx,js,jsx}"
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true
    lint-astro:
      priority: 1
      glob: "*.astro"
      run: bunx eslint --no-error-on-unmatched-pattern --fix {staged_files}
      stage_fixed: true
    format:
      priority: 2
      glob: "*.{ts,tsx,js,jsx,json,md,yml,yaml,css}"
      run: bunx oxfmt --write {staged_files}
      stage_fixed: true
    format-astro:
      priority: 2
      glob: "*.astro"
      run: bunx prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    format:
      run: bun run format
    lint:
      run: bun run lint
    typecheck:
      run: bun run typecheck
    test:
      run: bun run test
