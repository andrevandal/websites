layer: "library"
language: "typescript"

project:
  title: "Sun UI"
  description: "A shared UI components package"
  channel: ""
  owner: ""
  maintainers: []

tasks:
  check:
    command: astro check
    inputs:
      - "src/**/*.astro"
      - "src/**/*.svelte"
      - "src/**/*.ts"
      - "tsconfig.json"
      - "/tsconfig.json"
      - "/tsconfig.options.json"
      - "/tsconfig.packages.json"

  build:
    command: "tsdown"
    inputs:
      - "src/**/*.ts"
      - "src/**/*.astro"
      - "src/**/*.svelte"
      - "tsconfig.json"
      - "tsdown.config.ts"
      - "/tsconfig.json"
      - "/tsconfig.options.json"
      - "/tsconfig.packages.json"
    outputs:
      - dist
    dependsOn:
      - check

  test:
    script: "rm -rf coverage && bun test --pass-with-no-tests --coverage --coverage-reporter=lcov --coverage-dir=coverage"
    outputs: ["coverage/lcov.info"]
