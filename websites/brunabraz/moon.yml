layer: "application"
language: "astro"
tags:
  - "cloudflare"

project:
  title: "brunabraz"
  description: "Website for Bruna Braz"

tasks:
  astro:
    command: astro

  dev:
    command: astro dev
    preset: server
    dependsOn:
      - typegen
      - ^:build

  check:
    command: astro check
    inputs:
      - "@globs(typescript)"
      - "@globs(sources)"
      - "@globs(typescript)"
      - "./astro.config.js"
      - "/packages/sun-ui/src/**/*"
    dependsOn:
      - ^:build

  build:
    command: astro build
    inputs:
      - "@globs(sources)"
      - "@globs(public)"
      - "@globs(typescript)"
      - "/packages/sun-ui/src/**/*"
      - "./astro.config.js"
      - "$SITE_URL"
      - "$IMAGES_BASE_URL"
      - "$ENABLE_PARTYTOWN"
      - "$PUBLIC_GOOGLE_ANALYTICS_ID"
      - "$PUBLIC_GOOGLE_ADS_CONVERSION_ID"
      - "$PUBLIC_GOOGLE_ADS_CONVERSION_LABEL"
    outputs:
      - dist
    dependsOn:
      - check

  preview:
    command: astro preview
    preset: server

  preview-wrangler:
    command: wrangler pages dev ./dist
    preset: server
    dependsOn:
      - build

  deploy:
    command: bunx wrangler deploy
    dependsOn:
      - build

  test:
    command: "bun test --isolate --pass-with-no-tests"
    inputs:
      - "@globs(tests)"
      - "@globs(typescript)"
      - "@globs(sources)"
      - "bunfig.toml"
      - "/bunfig.toml"
      - "/happydom.ts"
      - "/packages/sun-ui/src/**/*"

  typecheck:
    inputs:
      - "@globs(typescript)"
      - "@globs(sources)"
      - "@globs(tests)"
      - "/packages/sun-ui/src/**/*"

workspace:
  inheritedTasks:
    # Client sites are not in coverage.config.ts; their tests still run in `test`.
    exclude:
      - coverage
