layer: "application"
language: "astro"
tags:
  - "cloudflare"

project:
  title: "clinicamauricioaraujo.com.br"
  description: "Website for Clinica Mauricio Araujo."

tasks:
  astro:
    command: astro

  dev:
    command: astro dev
    preset: server
    dependsOn:
      - typegen

  check:
    command: astro check
    inputs:
      - "@globs(typescript)"
      - "@globs(sources)"
      - "@globs(typescript)"
      - "./astro.config.js"
      - "/packages/sun-ui/src/**/*"
    dependsOn:
      - ^:build

  build:
    command: astro build
    inputs:
      - "@globs(sources)"
      - "@globs(public)"
      - "@globs(typescript)"
      - "/packages/sun-ui/src/**/*"
      - "./astro.config.js"
    outputs:
      - dist
    dependsOn:
      - check

  preview:
    command: astro preview
    preset: server

  preview-wrangler:
    command: wrangler pages dev ./dist
    preset: server
    dependsOn:
      - build

  test:
    inputs:
      - "@globs(tests)"
      - "@globs(typescript)"
      - "@globs(sources)"
      - "bunfig.toml"
      - "/bunfig.toml"
      - "/packages/sun-ui/src/**/*"

  sync:
    command: astro sync
    inputs:
      - "./astro.config.js"
      - "@globs(typescript)"
    outputs:
      - .astro
    dependsOn:
      - ^:build

  typecheck:
    dependsOn:
      - sync
    inputs:
      - "@globs(typescript)"
      - "@globs(sources)"
      - "@globs(tests)"
      - "/packages/sun-ui/src/**/*"

workspace:
  inheritedTasks:
    # Client sites are not in coverage.config.ts; their tests still run in `test`.
    exclude:
      - coverage
