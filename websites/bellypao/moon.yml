layer: "application"
language: "astro"
tags:
  - "cloudflare"

project:
  title: "bellypao"
  description: "Pães, bolos e salgados frescos e café da manhã e tarde para empresas em Guarulhos."
tasks:
  astro:
    command: astro

  dev:
    command: astro dev
    preset: server
    dependsOn:
      - typegen
      - ^:build

  check:
    command: astro check
    inputs:
      - "@globs(typescript)"
      - "@globs(sources)"
      - "./astro.config.js"
      - "/packages/sun-ui/src/**/*"
    dependsOn:
      - ^:build

  build:
    command: astro build
    inputs:
      - "@globs(sources)"
      - "@globs(public)"
      - "@globs(typescript)"
      - "/packages/sun-ui/src/**/*"
      - "./astro.config.js"
    outputs:
      - dist
    dependsOn:
      - check

  preview:
    command: astro preview
    preset: server

  preview-wrangler:
    command: wrangler pages dev ./dist
    preset: server
    dependsOn:
      - build

  test:
    command: "bun test --isolate --pass-with-no-tests"
    inputs:
      - "@globs(tests)"
      - "@globs(typescript)"
      - "@globs(sources)"
      - "bunfig.toml"
      - "/bunfig.toml"
      - "/packages/sun-ui/src/**/*"

  typecheck:
    inputs:
      - "@globs(typescript)"
      - "@globs(sources)"
      - "@globs(tests)"
      - "/packages/sun-ui/src/**/*"
    dependsOn:
      - check

workspace:
  inheritedTasks:
    # Client sites are not in coverage.config.ts; their tests still run in `test`.
    exclude:
      - coverage
