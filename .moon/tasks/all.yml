$schema: https://moonrepo.dev/schemas/tasks.json

implicitInputs:
  - package.json

fileGroups:
  public:
    - public/**/*
  sources:
    - src/**/*
  tests:
    - "**/*.{test,spec}.{js,mjs,cjs,ts,mts,cts}"
  typescript:
    - tsconfig.json
    - tsconfig.*.json
    - /tsconfig.json
    - /tsconfig.*.json
  content:
    - "**/*.{md,mdx,yml,yaml,json}"

tasks:
  typecheck:
    command: "bun x tsc --noEmit --pretty"
    inputs:
      - "@globs(typescript)"
      - "@globs(sources)"
    dependsOn:
      - ^:build

  test:
    command: "bun test --pass-with-no-tests"
    inputs:
      - "@globs(tests)"
      - "@globs(typescript)"
      - "@globs(sources)"
