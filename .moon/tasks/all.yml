$schema: https://moonrepo.dev/schemas/tasks.json

implicitDeps:
  - ^:build

implicitInputs:
  - package.json

fileGroups:
  public:
    - public/**/*
  sources:
    - src/**/*
  tests:
    - "**/*.{test,spec}.{js,mjs,cjs,ts,mts,cts}"
  astro:
    - "astro.config.{js,mjs,cjs,ts,mts,cts}"
  typescript:
    - tsconfig.json
    - tsconfig.*.json
    - /tsconfig.json
    - /tsconfig.*.json
  content:
    - "**/*.{md,mdx,yml,yaml,json}"

tasks:
  format:
    command: oxfmt
    args:
      - --config
      - "@in(0)"
      - --check
      - .
    inputs:
      - /.oxfmtrc.json
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(content)"
    dependsOn:
      - format-astro

  format-astro:
    command: prettier
    args:
      - --check
      - --no-error-on-unmatched-pattern
      - "**/*.astro"
    inputs:
      - /prettier.config.ts
      - "@globs(sources)"
      - "@globs(astro)"

  formatfix:
    command: oxfmt
    args:
      - --config
      - "@in(0)"
      - --write
      - .
    inputs:
      - /.oxfmtrc.json
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(content)"
    preset: server
    dependsOn:
      - formatfix-astro

  formatfix-astro:
    extends: format-astro
    options:
      mergeArgs: "prepend"
    command: prettier
    args:
      - --write
    preset: server

  lint:
    command: oxlint
    args:
      - .
    inputs:
      - "@globs(typescript)"
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(content)"
      - /.oxlintrc.json
    dependsOn:
      - lint-astro

  lint-astro:
    command: eslint
    args:
      - --no-error-on-unmatched-pattern
      - "**/*.astro"
    inputs:
      - /eslint.config.ts
      - "@globs(sources)"

  lintfix:
    extends: lint
    options:
      mergeArgs: "prepend"
    args:
      - --fix
    preset: server
    dependsOn:
      - lintfix-astro

  lintfix-astro:
    extends: lint-astro
    options:
      mergeArgs: "prepend"
    args:
      - --fix
    preset: server

  testci:
    command: bun
    args:
      - test
      - --coverage
      - --pass-with-no-tests
      - .
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"

  test:
    extends: testci
    preset: server

  typecheck:
    command: tsc
    args:
      - --noEmit
      - --pretty
    inputs:
      - "@globs(typescript)"
      - "@globs(sources)"
      - "@globs(tests)"
