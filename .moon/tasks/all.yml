$schema: https://moonrepo.dev/schemas/tasks.json

# For typechecking to run correctly, build must run first to generate
# any necessary type declaration files.
implicitDeps:
  - ^:build

implicitInputs:
  - package.json

fileGroups:
  sources:
    - src/**/*
  tests:
    - "**/*.{test,spec}.{js,mjs,cjs,ts,mts,cts}"
  typescript:
    - tsconfig.json
    - tsconfig.*.json
    - /tsconfig.json
    - /tsconfig.*.json

tasks:
  format:
    command: oxfmt
    args:
      - --config
      - "@in(0)"
      - --check
      - .
    inputs:
      - /.oxfmtrc.json
      - "@globs(sources)"
      - "@globs(tests)"
      - "**/*.{md,mdx,yml,yaml,json}"

  formatfix:
    inputs:
      - /.oxfmtrc.json
      - "@globs(sources)"
      - "@globs(tests)"
      - "**/*.{md,mdx,yml,yaml,json}"
    command: oxfmt
    args:
      - --config
      - "@in(0)"
      - --write
      - .
    preset: server # does not run on ci

  lint:
    command: oxlint
    args:
      - .
    inputs:
      - "@globs(typescript)"
      - "@globs(sources)"
      - "@globs(tests)"
      - "**/*.{md,mdx,yml,yaml,json}"
      - /.oxlintrc.json

  lintfix:
    inputs:
      - "@globs(typescript)"
      - "@globs(sources)"
      - "@globs(tests)"
      - /.oxlintrc.json
    command: oxlint
    args:
      - --fix
      - .
    preset: server # does not run on ci

  testci:
    command: bun
    args:
      - test
      - --coverage
      - --pass-with-no-tests
      - .
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"

  test:
    extends: testci
    preset: server # does not run on ci

  typecheck:
    command: tsc
    args:
      - --noEmit
      - --pretty
    inputs:
      - "@globs(typescript)"
      - "@globs(sources)"
      - "@globs(tests)"
