$schema: https://moonrepo.dev/schemas/tasks.json

implicitDeps:
  - ^:build

implicitInputs:
  - package.json

fileGroups:
  public:
    - public/**/*
  sources:
    - src/**/*
  tests:
    - "**/*.{test,spec}.{js,mjs,cjs,ts,mts,cts}"
  typescript:
    - tsconfig.json
    - tsconfig.*.json
    - /tsconfig.json
    - /tsconfig.*.json
  content:
    - "**/*.{md,mdx,yml,yaml,json}"
