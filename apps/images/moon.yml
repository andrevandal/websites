layer: "application"
language: "typescript"

project:
  title: "Images"
  description: "websites images service."
  channel: ""
  owner: ""
  maintainers: []

tasks:
  dev:
    command: "bun --hot src/index.ts"
    preset: server
    options:
      persistent: true

  build:
    command: "bun build src/index.ts --outdir dist --target bun"
    inputs:
      - "src/**/*"
    outputs:
      - "dist"

  test:
    script: "rm -rf coverage && bun test --pass-with-no-tests --coverage --coverage-reporter=lcov --coverage-dir=coverage"
    outputs: ["coverage/lcov.info"]
